# Adapted from https://github.com/getkyo/kyo/blob/v1.0.0-RC7/.scalafmt.conf
# File overrides for trees that are not in this repo are omitted.
version = "3.11.5"
runner.dialect = scala3
rewrite.rules = [SortModifiers, Imports]
rewrite.imports.expand = true
rewrite.imports.sort = scalastyle
rewrite.scala3.convertToNewSyntax = true
rewrite.scala3.removeOptionalBraces = true
rewrite.scala3.insertEndMarkerMinLines = 4
rewriteTokens = {
  "⇒": "=>"
  "→": "->"
  "←": "<-"
}
align.preset = more
maxColumn = 140
indent.main = 4
indent.callSite = 4
newlines.source = keep
docstrings.wrap = keep
docstrings.style = SpaceAsterisk
fileOverride {
  "glob:**/project/**" {
    runner.dialect = scala212source3
  }
  # kyo-scheduler-cats cross-builds Scala 2.13 with -Xsource:3, same as Kyo's
  # kyo-scheduler modules. Keep a Scala 2 dialect so formatting stays parseable there.
  "glob:**/kyo-scheduler*/**" {
    runner.dialect = scala212source3
  }
}
