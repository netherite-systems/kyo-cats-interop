name: Release

# Same process as getkyo/kyo: the version comes from the git tag via
# sbt-ci-release / sbt-dynver — there is no `version :=` in build.sbt.
# Pushing e.g. `v0.1.1` publishes exactly `0.1.1`.
# (`fetch-depth: 0` is load-bearing: dynver needs the tags and history.)
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: sbt
      - uses: sbt/setup-sbt@v1
      # No Node / Scala Native toolchain here: `ci-release` only compiles
      # and jars (JVM/JS/Native); linking and tests already ran in CI on main.
      - name: Publish to Maven Central
        run: sbt -batch ci-release
        env:
          PGP_PASSPHRASE: ${{ secrets.PGP_PASSPHRASE }}
          PGP_SECRET: ${{ secrets.PGP_SECRET }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
