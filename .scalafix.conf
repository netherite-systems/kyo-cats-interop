# Kyo does not ship a .scalafix.conf (absent on main and v1.0.0-RC7).
# RemoveUnused is the built-in semantic rule. Imports only: privates, locals,
# pattern variables, and parameters stay, so the rule does not delete code.
# See https://scalacenter.github.io/scalafix/docs/rules/RemoveUnused.html
rules = [
  RemoveUnused
]
RemoveUnused.imports = true
RemoveUnused.privates = false
RemoveUnused.locals = false
RemoveUnused.patternvars = false
RemoveUnused.params = false
